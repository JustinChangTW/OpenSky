name: ci

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Lint
        run: node scripts/lint.mjs

      - name: Typecheck
        run: node scripts/typecheck.mjs

      - name: Test
        run: node scripts/test.mjs

      - name: Build
        run: node scripts/build.mjs
